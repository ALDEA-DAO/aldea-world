# Local infrastructure for `pnpm dev` (mprocs.yaml): Postgres 16 and anvil.
# Services (resolver, Effectstream, relay, indexer, client) run on the host through mprocs.
name: aldea-world

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: aldea
      POSTGRES_PASSWORD: aldea
      POSTGRES_DB: aldea
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aldea -d aldea"]
      interval: 2s
      timeout: 3s
      retries: 30

  anvil:
    image: ghcr.io/foundry-rs/foundry:stable
    entrypoint: ["anvil", "--host", "0.0.0.0", "--block-time", "2", "--base-fee", "0"]
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
