# Dolos, a light Cardano data node, following preprod for local development: Effectstream reads $ALDEA (tALDEA here)
# from it over UTxO RPC (gRPC, port 50051). Run it with scripts/cardano/dolos.sh.
#
# Generated by `dolos init --known-network preprod` (v1.6.1), which also wrote the genesis files next to this one.

[upstream]
peer_address = "preprod-node.world.dev.cardano.org:30000"

[storage]
version = "v3"
path = "data"

[genesis]
byron_path = "byron.json"
shelley_path = "shelley.json"
alonzo_path = "alonzo.json"
conway_path = "conway.json"

[sync]
# Slots of history kept (1 slot = 1 s). The default is one day; Effectstream starts reading at the slot where tALDEA
# was minted, so nothing from the snapshot onwards may be pruned: ten years.
max_history = 315360000
max_rollback = 129600

[serve.grpc]
listen_address = "[::]:50051"

# Only used by `dolos bootstrap mithril`: Mithril's preprod aggregator and the keys its certificates are checked with
[mithril]
aggregator = "https://aggregator.release-preprod.api.mithril.network/aggregator"
genesis_key = "5b3132372c37332c3132342c3136312c362c3133372c3133312c3231332c3230372c3131372c3139382c38352c3137362c3139392c3136322c3234312c36382c3132332c3131392c3134352c31332c3233322c3234332c34392c3232392c322c3234392c3230352c3230352c33392c3233352c34345d"
ancillary_key = "5b3138392c3139322c3231362c3135302c3131342c3231362c3233372c3231302c34352c31382c32312c3139362c3230382c3234362c3134362c322c3235322c3234332c3235312c3139372c32382c3135372c3230342c3134352c33302c31342c3232382c3136382c3132392c38332c3133362c33365d"

[chain]
type = "cardano"
magic = 1
is_testnet = true
