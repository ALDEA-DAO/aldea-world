# ALMA Resolver + ALMA Auth (staging). Deploy from the repository root:
#   fly deploy . --config infra/fly/alma-resolver.toml --dockerfile infra/docker/node-service.Dockerfile
# Secrets (fly secrets set -c infra/fly/alma-resolver.toml …): DATABASE_URL, ALMA_AUTH_JWKS, ALMA_AUTH_COOKIE_KEYS,
# ALMA_AUTH_PAIRWISE_SALT, EMAIL_HMAC_KEY, RESEND_API_KEY, TURNKEY_ORG_ID, TURNKEY_API_PUBLIC_KEY,
# TURNKEY_API_PRIVATE_KEY, CDP_PAYMASTER_URL, ALMA_AUTH_CLIENTS, SENTRY_DSN
app = "aldea-staging-resolver"
primary_region = "gru"

[build.args]
  PACKAGE = "@aldea/alma-resolver"

[deploy]
  release_command = "pnpm --filter @aldea/alma-resolver db:migrate"

[env]
  NODE_ENV = "production"
  PORT = "8787"
  BASE_CHAIN_ID = "84532"
  BASE_RPC_URL = "https://sepolia.base.org"
  # ALMA Auth's domain: passkeys are bound to it, it must never change once the first one is registered
  ALMA_AUTH_ISSUER = "https://auth.adasouls.io"
  ALMA_API_RESOURCE = "https://auth.adasouls.io/v1"
  WEBAUTHN_RP_ID = "auth.adasouls.io"
  RESEND_FROM = "ALMA <login@adasouls.io>"
  CORS_ORIGINS = "https://staging.aldea.world"
  TURNKEY_OIDC_AUDIENCE = "aldea-world"
  EFFECTSTREAM_API_URL = "http://aldea-staging-effectstream.internal:9999"
  # WORLD_ADDRESS and ALMA_REGISTRY_ADDRESS (sponsored-gas allowlist): set after the contracts are deployed

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1

  [[http_service.checks]]
    path = "/health"
    interval = "15s"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
