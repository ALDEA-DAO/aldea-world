name: CI

on:
  pull_request:
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # anvil's default account 0 (public development key): `mud test` deploys the World on its own anvil with it
  PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"

jobs:
  lint-typecheck:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm -r typecheck

  contracts:
    name: Contracts (mud test + forge test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: stable }
      - run: pnpm install --frozen-lockfile
      - name: forge test (council)
        working-directory: packages/council
        run: forge test -vv
      - name: mud test (World)
        working-directory: packages/contracts
        run: pnpm build && pnpm test
      - name: Generated ABIs are up to date
        run: |
          pnpm --filter @aldea/shared abis
          git diff --exit-code packages/shared/src/abis/generated

  unit:
    name: Unit tests (vitest / bun test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aldea/shared test
      - run: pnpm --filter @aldea/alma-resolver test
      - run: pnpm --filter @aldea/effectstream-node test
      - run: pnpm --filter @aldea/relay-worker test

  client:
    name: Client build and initial JS budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter client build
      - name: Initial JavaScript ≤ 250 KB gzip
        run: pnpm check:bundle

  slither:
    name: Slither (fails on high)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: stable }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install slither-analyzer
      - run: pnpm install --frozen-lockfile
      - name: Council executor
        working-directory: packages/council
        run: slither . --config-file ../../.slither.config.json
      - name: World systems
        working-directory: packages/contracts
        run: pnpm build && slither . --config-file ../../.slither.config.json

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Scan history
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks detect --redact --no-banner --config .gitleaks.toml
