name: Deploy staging

# Manual: deploys the services to Fly.io and the client preview to Cloudflare Pages. The contracts are deployed once,
# by hand, with scripts/deploy-staging.sh (see infra/README.md); this workflow needs their committed deployment file.
on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        default: all
        options: [all, alma-resolver, effectstream-node, relay-worker, mud-indexer, client]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  services:
    name: ${{ matrix.service.name }}
    if: inputs.target != 'client'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: alma-resolver, dockerfile: node-service }
          - { name: effectstream-node, dockerfile: effectstream-node }
          - { name: relay-worker, dockerfile: node-service }
          - { name: mud-indexer, dockerfile: mud-indexer }
    steps:
      - uses: actions/checkout@v7
      - name: The contracts are deployed
        run: test -f packages/shared/src/deployments/84532.json
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        if: inputs.target == 'all' || inputs.target == matrix.service.name
        run: flyctl deploy . --config infra/fly/${{ matrix.service.name }}.toml --dockerfile infra/docker/${{ matrix.service.dockerfile }}.Dockerfile --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  client:
    name: client (staging.aldea.world)
    if: inputs.target == 'all' || inputs.target == 'client'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter client build
        env:
          VITE_CHAIN_ID: "84532"
          VITE_AA_MODE: smart
          VITE_ALMA_AUTH_ISSUER: https://auth.adasouls.io
          VITE_ALMA_AUTH_CLIENT_ID: aldea-world
          VITE_ALMA_API_URL: https://auth.adasouls.io
          VITE_MUD_INDEXER_URL: https://aldea-staging-indexer.fly.dev
          VITE_BUILD_GIT_COMMIT: ${{ github.sha }}
      - name: Publish to Cloudflare Pages
        run: pnpm dlx wrangler pages deploy packages/client/dist --project-name aldea-world-staging --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
