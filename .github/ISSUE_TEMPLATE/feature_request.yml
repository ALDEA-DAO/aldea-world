name: Feature or change proposal
description: Propose a feature or a change to the world
labels: [proposal]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem or opportunity }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposal }
    validations: { required: true }
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options: [Code or tooling, World design (tribes, classes, buildings, lore), Governance or the Charter]
    validations: { required: true }
