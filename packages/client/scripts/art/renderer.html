<!doctype html>
<meta charset="utf-8">
<title>ALDEA art renderer</title>
<script type="importmap">{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }</script>
<script type="module">
/*
 * Renders Kenney's 3D models as isometric 2D sprites: an orthographic camera turned 45° and raised 30°, so a ground
 * square becomes the classic 2:1 diamond. One world unit is one map tile (TILE_W px wide on screen).
 */
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import * as SkeletonUtils from "three/addons/utils/SkeletonUtils.js";

const TILE_W = 128;
const PPU = TILE_W / Math.SQRT2; // screen pixels per world unit along the camera's horizontal axis
const ELEVATION = Math.PI / 6; // 30°: a unit square projects to a 2:1 diamond

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const loader = new GLTFLoader();
const cache = new Map();
const load = (url) => {
  if (!cache.has(url)) cache.set(url, loader.loadAsync(url));
  return cache.get(url);
};

function lights(scene) {
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7a66, 1.6));
  const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
  sun.position.set(-3, 6, 2); // from the upper left of the screen, like the map's shadows
  scene.add(sun);
}

/** Camera looking at the origin from yaw (0 = the map's default view) at the isometric elevation. */
function camera(yaw, halfW, halfH) {
  const cam = new THREE.OrthographicCamera(-halfW, halfW, halfH, -halfH, 0.1, 200);
  const d = 50;
  const a = Math.PI / 4 + yaw;
  cam.position.set(Math.sin(a) * Math.cos(ELEVATION) * d, Math.sin(ELEVATION) * d, Math.cos(a) * Math.cos(ELEVATION) * d);
  cam.lookAt(0, 0, 0);
  cam.updateMatrixWorld();
  cam.updateProjectionMatrix();
  return cam;
}

/** Screen-space bounds (in world units on the camera plane) of an object, for a tight crop. */
function screenBounds(object, yaw) {
  const cam = camera(yaw, 1, 1);
  const box = new THREE.Box3().setFromObject(object);
  const min = new THREE.Vector2(Infinity, Infinity);
  const max = new THREE.Vector2(-Infinity, -Infinity);
  for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y]) for (const z of [box.min.z, box.max.z]) {
    const p = new THREE.Vector3(x, y, z).applyMatrix4(cam.matrixWorldInverse);
    min.min(new THREE.Vector2(p.x, p.y));
    max.max(new THREE.Vector2(p.x, p.y));
  }
  return { min, max };
}

async function build(pieces) {
  const group = new THREE.Group();
  for (const piece of pieces) {
    const gltf = await load(piece.url);
    const node = SkeletonUtils.clone(gltf.scene);
    node.position.set(...(piece.pos ?? [0, 0, 0]));
    node.rotation.y = ((piece.rot ?? 0) * Math.PI) / 2; // quarter turns (fractions for 8-direction characters)
    // Kenney's foliage is single-sided planes: show both faces instead of black backs
    node.traverse((o) => o.isMesh && (o.material.side = THREE.DoubleSide));
    if (piece.scale) node.scale.setScalar(piece.scale);
    node.userData.animations = gltf.animations;
    group.add(node);
  }
  return group;
}

/**
 * Renders pieces into a PNG. Returns the data URL, its size and the pixel where the world origin (0, 0, 0) lands
 * (the sprite's anchor on the map). `frame` fixes the crop in world units ([minX, minY, maxX, maxY] on the camera
 * plane) so animation frames share one size; without it the sprite is cropped tight.
 */
window.renderSprite = async ({ pieces, yaw = 0, animation, time = 0, frame, grayscale = false, pad = 2 }) => {
  const scene = new THREE.Scene();
  lights(scene);
  const group = await build(pieces);
  scene.add(group);
  if (animation) {
    for (const node of group.children) {
      const clip = (node.userData.animations ?? []).find((c) => c.name === animation);
      if (!clip) continue;
      const mixer = new THREE.AnimationMixer(node);
      mixer.clipAction(clip).play();
      mixer.setTime(time * clip.duration);
    }
    group.updateMatrixWorld(true);
  }
  const b = frame ? { min: new THREE.Vector2(frame[0], frame[1]), max: new THREE.Vector2(frame[2], frame[3]) } : screenBounds(group, yaw);
  const w = Math.ceil((b.max.x - b.min.x) * PPU) + pad * 2;
  const h = Math.ceil((b.max.y - b.min.y) * PPU) + pad * 2;
  const cam = camera(yaw, 1, 1);
  cam.left = b.min.x - pad / PPU;
  cam.right = cam.left + w / PPU;
  cam.top = b.max.y + pad / PPU;
  cam.bottom = cam.top - h / PPU;
  cam.updateProjectionMatrix();
  renderer.setSize(w, h, false);
  renderer.render(scene, cam);

  let canvas = renderer.domElement;
  if (grayscale) {
    canvas = document.createElement("canvas");
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(renderer.domElement, 0, 0);
    const img = ctx.getImageData(0, 0, w, h);
    for (let i = 0; i < img.data.length; i += 4) {
      const l = Math.round(0.299 * img.data[i] + 0.587 * img.data[i + 1] + 0.114 * img.data[i + 2]);
      img.data[i] = img.data[i + 1] = img.data[i + 2] = l;
    }
    ctx.putImageData(img, 0, 0);
  }
  // The world origin sits at camera-plane (0, 0)
  return { png: canvas.toDataURL("image/png"), width: w, height: h, anchor: [Math.round(-cam.left * PPU), Math.round(cam.top * PPU)] };
};

/**
 * A sprite sheet of one model: a row per facing (`rots`, in quarter turns) and a column per animation frame
 * (`frames`: [{ animation, time 0..1 }]), every cell with the same crop (`frame`) so the sheet loads as a grid.
 * Returns the PNG, the cell size and the cell's anchor (where the model's feet are).
 */
window.renderSheet = async ({ url, scale = 1, rots, frames, frame }) => {
  let sheet, ctx, cell;
  for (const [row, rot] of rots.entries()) {
    for (const [col, f] of frames.entries()) {
      const out = await window.renderSprite({ pieces: [{ url, rot, scale }], animation: f.animation, time: f.time, frame, pad: 0 });
      if (!sheet) {
        cell = out;
        sheet = document.createElement("canvas");
        sheet.width = out.width * frames.length;
        sheet.height = out.height * rots.length;
        ctx = sheet.getContext("2d");
      }
      ctx.drawImage(renderer.domElement, col * cell.width, row * cell.height);
    }
  }
  return { png: sheet.toDataURL("image/png"), width: sheet.width, height: sheet.height, frameWidth: cell.width, frameHeight: cell.height, anchor: cell.anchor };
};

/**
 * Ground tiles drawn procedurally: a 2:1 diamond per tile with a base color and deterministic speckles, in one row.
 * tiles: [{ base, speckles: [color…], density }]
 */
window.renderTileset = (tiles) => {
  const W = TILE_W, H = TILE_W / 2;
  const canvas = document.createElement("canvas");
  canvas.width = W * tiles.length;
  canvas.height = H;
  const ctx = canvas.getContext("2d");
  let seed = 7;
  const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
  tiles.forEach((tile, i) => {
    const x0 = i * W;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x0 + W / 2, 0);
    ctx.lineTo(x0 + W, H / 2);
    ctx.lineTo(x0 + W / 2, H);
    ctx.lineTo(x0, H / 2);
    ctx.closePath();
    ctx.fillStyle = tile.base;
    ctx.fill();
    ctx.clip();
    for (let n = 0; n < (tile.density ?? 26); n++) {
      ctx.fillStyle = tile.speckles[Math.floor(rnd() * tile.speckles.length)];
      const w = 3 + rnd() * 7;
      ctx.fillRect(x0 + rnd() * W, rnd() * H, w, w / 2);
    }
    ctx.restore();
  });
  return { png: canvas.toDataURL("image/png"), width: canvas.width, height: canvas.height };
};

/** Clip names and durations of a model (to pick animation frames). */
window.animationsOf = async (url) => (await load(url)).animations.map((c) => ({ name: c.name, duration: c.duration }));
/** Bounding box of a model in world units: { min: [x, y, z], max: [x, y, z] } (to stack and place pieces). */
window.boundsOf = async (url) => {
  const box = new THREE.Box3().setFromObject((await load(url)).scene);
  return { min: box.min.toArray().map((n) => +n.toFixed(3)), max: box.max.toArray().map((n) => +n.toFixed(3)) };
};
window.ready = true;
</script>
