[profile.default]
solc = "0.8.24"
via_ir = true
optimizer = true
optimizer_runs = 1000
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["node_modules"]
allow_paths = ["../../node_modules"]
# Deploy.s.sol writes the addresses to packages/shared/src/deployments/<chainId>.json
fs_permissions = [
  { access = "read-write", path = "../shared/src/deployments" },
  { access = "read-write", path = "./cache" },
]

[profile.base-sepolia]
eth_rpc_url = "https://sepolia.base.org"

[profile.base]
eth_rpc_url = "https://mainnet.base.org"

[lint]
lint_on_build = false
