[profile.default]
solc = "0.8.24"
via_ir = true
ffi = false
optimizer = true
optimizer_runs = 3000
verbosity = 2
src = "src"
test = "test"
out = "out"
allow_paths = [
  # pnpm symlinks to the project root's node_modules
  "../../node_modules",
  "./node_modules",
  # the World tests deploy the real AlmaAnchorRegistry from the protocol package
  "../protocol",
]
extra_output_files = ["abi", "evm.bytecode"]
fs_permissions = [{ access = "read", path = "./" }]

# Public RPCs as defaults; the deploy scripts override them with BASE_SEPOLIA_RPC_URL / BASE_RPC_URL
# (a dedicated provider is recommended: the public endpoints are rate limited).
[profile.base-sepolia]
eth_rpc_url = "https://sepolia.base.org"

[profile.base]
eth_rpc_url = "https://mainnet.base.org"

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 40
fail_on_revert = false

[lint]
# forge lint floods the build output with notes about MUD-generated code
lint_on_build = false
